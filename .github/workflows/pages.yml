# Publica o site no GitHub Pages a cada push na branch principal.
# Pré-requisito (uma vez só): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/loving-newton-d3n1uu, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Só os arquivos do site vão para o ar (README e workflow ficam de fora)
      - name: Montar a pasta do site
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg css js imagens _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
